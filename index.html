<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Your Car</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #1a1a1a;
            border-radius: 4px;
            padding: 40px;
            max-width: 700px;
            width: 100%;
            border: 2px solid #ff0000;
        }

        h1 {
            text-align: center;
            color: #ffffff;
            margin-bottom: 30px;
            font-size: 2em;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .step {
            display: none;
        }

        .step.active {
            display: block;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .question {
            text-align: center;
            font-size: 1.5em;
            color: #ffffff;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .option {
            padding: 20px;
            border: 2px solid #333;
            border-radius: 2px;
            background: #0a0a0a;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            font-size: 1.1em;
            color: #ffffff;
        }

        .option.selected {
            border-color: #ff0000;
            background: #ff0000;
            color: #000000;
            font-weight: bold;
        }

        .option-icon {
            font-size: 2em;
            margin-bottom: 10px;
        }

        /* Color swatch styles */
        .color-swatch {
            width: 80px;
            height: 80px;
            margin: 0 auto 10px;
            border: 3px solid #333;
            border-radius: 50%;
            transition: all 0.2s ease;
        }

        .option:hover .color-swatch {
            border-color: #ff0000;
            transform: scale(1.05);
        }

        .option.selected .color-swatch {
            border-color: #ffffff;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
        }

        /* Enhanced affordance - add scale and shadow on hover */
        .option:hover {
            border-color: #ff0000;
            background: #1a1a1a;
            transform: scale(1.03);
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.3);
        }

        .option:active {
            transform: scale(0.98);
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        button {
            padding: 12px 30px;
            font-size: 1em;
            border: 2px solid;
            border-radius: 0;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-back {
            background: #0a0a0a;
            color: #ffffff;
            border-color: #333;
        }

        .btn-back:hover:not(:disabled) {
            background: #1a1a1a;
            border-color: #ff0000;
        }

        .btn-next {
            background: #ff0000;
            color: #000000;
            border-color: #ff0000;
            margin-left: auto;
        }

        .btn-next:hover:not(:disabled) {
            background: #cc0000;
            border-color: #cc0000;
        }

        .btn-next:disabled {
            background: #333;
            border-color: #333;
            color: #666;
            cursor: not-allowed;
        }

        .hidden {
            display: none !important;
        }

        /* Final Screen Styles */
        #final-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, #87CEEB 0%, #87CEEB 60%, #8B7355 60%, #8B7355 100%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 0;
            z-index: 1000;
        }

        .summary {
            background: rgba(10, 10, 10, 0.9);
            padding: 20px 40px;
            margin: 20px auto 0;
            border: 2px solid #ff0000;
            max-width: 700px;
        }

        .summary h2 {
            color: #ff0000;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 1.5em;
        }

        .summary p {
            color: #ffffff;
            font-size: 1.1em;
            margin: 5px 0;
        }

        .road {
            background: #666666;
            height: 150px;
            position: relative;
            overflow: visible;
            width: 100%;
            margin: 0;
            border: none;
            box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.3);
        }

        .road-lines {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 6px;
            background: repeating-linear-gradient(
                to right,
                transparent,
                transparent 30px,
                #FFD700 30px,
                #FFD700 60px
            );
            transform: translateY(-50%);
        }

        .car {
            position: absolute;
            bottom: 50px;
            width: 120px;
            height: 60px;
            transition: left 0.1s ease;
            left: 50%;
            transform: translateX(-50%);
        }

        .car-body {
            position: relative;
            width: 100%;
            height: 35px;
            background: red;
            border-radius: 8px;
            margin-bottom: 5px;
        }

        .car-roof {
            position: absolute;
            top: -15px;
            left: 25%;
            width: 50%;
            height: 20px;
            background: inherit;
            border-radius: 8px 8px 0 0;
        }

        .car-window {
            position: absolute;
            top: -12px;
            left: 28%;
            width: 44%;
            height: 12px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 4px 4px 0 0;
        }

        .car-wheels {
            display: flex;
            justify-content: space-between;
            padding: 0 15px;
        }

        .wheel {
            width: 20px;
            height: 20px;
            background: #333;
            border-radius: 50%;
            transition: transform 0.1s linear;
        }

        .wheel.square {
            border-radius: 3px;
        }

        .wheel.star {
            background: #333;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
        }

        /* Pattern Styles */
        .pattern-stripes {
            background-image: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 10px,
                #ffffff 10px,
                #ffffff 20px
            );
        }

        .pattern-dots {
            background-image: radial-gradient(circle, #ffffff 3px, transparent 3px);
            background-size: 15px 15px;
        }

        .pattern-zigzag {
            background-image: linear-gradient(135deg, #ffffff 25%, transparent 25%),
                              linear-gradient(225deg, #ffffff 25%, transparent 25%),
                              linear-gradient(45deg, #ffffff 25%, transparent 25%),
                              linear-gradient(315deg, #ffffff 25%, transparent 25%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 0, 10px -10px, 0 -10px;
        }

        .controls-area {
            position: absolute;
            bottom: 170px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
        }

        .btn-restart {
            background: #ff0000;
            color: #000000;
            border-color: #ff0000;
            padding: 15px 40px;
            font-size: 1.1em;
            margin-top: 20px;
        }

        .btn-restart:hover {
            background: #cc0000;
            border-color: #cc0000;
        }

        .instructions {
            color: #000000;
            font-style: normal;
            letter-spacing: 1px;
            font-size: 1.3em;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 30px;
            border: 3px solid #ff0000;
            border-radius: 0;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚗 Design Your Car</h1>

        <!-- Step 1: Choose Color -->
        <div id="step-1" class="step active">
            <div class="question">Choose your car color</div>
            <div class="options">
                <div class="option" data-value="Red">
                    <div class="color-swatch" style="background-color: #e74c3c;"></div>
                    Red
                </div>
                <div class="option" data-value="Blue">
                    <div class="color-swatch" style="background-color: #3498db;"></div>
                    Blue
                </div>
                <div class="option" data-value="Black">
                    <div class="color-swatch" style="background-color: #2c3e50;"></div>
                    Black
                </div>
                <div class="option" data-value="White">
                    <div class="color-swatch" style="background-color: #ecf0f1;"></div>
                    White
                </div>
                <div class="option" data-value="Yellow">
                    <div class="color-swatch" style="background-color: #f1c40f;"></div>
                    Yellow
                </div>
                <div class="option" data-value="Green">
                    <div class="color-swatch" style="background-color: #2ecc71;"></div>
                    Green
                </div>
            </div>
            <div class="navigation">
                <button class="btn-back hidden" id="back-1">Back</button>
                <button class="btn-next" id="next-1" disabled>Next</button>
            </div>
        </div>

        <!-- Step 2: Choose Tire Shape -->
        <div id="step-2" class="step">
            <div class="question">Choose your tire shape</div>
            <div class="options">
                <div class="option" data-value="circle">
                    <div class="option-icon">●</div>
                    Circle
                </div>
                <div class="option" data-value="square">
                    <div class="option-icon">■</div>
                    Square
                </div>
                <div class="option" data-value="star">
                    <div class="option-icon">★</div>
                    Star
                </div>
            </div>
            <div class="navigation">
                <button class="btn-back" id="back-2">Back</button>
                <button class="btn-next" id="next-2" disabled>Next</button>
            </div>
        </div>

        <!-- Step 3: Choose Pattern -->
        <div id="step-3" class="step">
            <div class="question">Choose your car pattern</div>
            <div class="options">
                <div class="option" data-value="stripes">
                    <div class="option-icon">▨</div>
                    Stripes
                </div>
                <div class="option" data-value="dots">
                    <div class="option-icon">⬡</div>
                    Dots
                </div>
                <div class="option" data-value="zigzag">
                    <div class="option-icon">〰️</div>
                    Zigzag
                </div>
            </div>
            <div class="navigation">
                <button class="btn-back" id="back-3">Back</button>
                <button class="btn-next" id="next-3" disabled>Finish</button>
            </div>
        </div>

        <!-- Final Screen -->
        <div id="final-screen" class="step">
            <div class="summary">
                <h2>Your Custom Car is Ready!</h2>
                <p id="summary-text"></p>
            </div>

            <div class="controls-area">
                <p class="instructions">Use ← → arrow keys to drive your car!</p>
                <button class="btn-restart" id="restart">Start Over</button>
            </div>

            <div class="road">
                <div class="road-lines"></div>
                <div class="car" id="car">
                    <div class="car-body" id="car-body">
                        <div class="car-roof"></div>
                        <div class="car-window"></div>
                    </div>
                    <div class="car-wheels">
                        <div class="wheel" id="wheel-1"></div>
                        <div class="wheel" id="wheel-2"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ===== STATE MANAGEMENT =====
        // This object holds all user selections and current app state
        const state = {
            currentStep: 1,
            selections: {
                color: null,
                tireShape: null,
                pattern: null
            },
            carPosition: 0, // Position of the car on the road (in pixels)
            wheelRotation: 0 // Rotation angle of the wheels (in degrees)
        };

        // Color mapping for CSS values
        const colorMap = {
            'Red': '#e74c3c',
            'Blue': '#3498db',
            'Black': '#2c3e50',
            'White': '#ecf0f1',
            'Yellow': '#f1c40f',
            'Green': '#2ecc71'
        };

        // ===== SOUND EFFECTS =====
        // Create engine "vroom" sound using Web Audio API
        function playEngineSound() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();

                // Create oscillator for the engine sound
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();

                // Connect nodes
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);

                // Configure the sound - start low and rev up
                oscillator.type = 'sawtooth'; // Sawtooth wave sounds more engine-like
                oscillator.frequency.setValueAtTime(80, audioContext.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(200, audioContext.currentTime + 0.1);
                oscillator.frequency.exponentialRampToValueAtTime(100, audioContext.currentTime + 0.3);

                // Volume envelope - fade in and out
                gainNode.gain.setValueAtTime(0, audioContext.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.3, audioContext.currentTime + 0.05);
                gainNode.gain.linearRampToValueAtTime(0, audioContext.currentTime + 0.3);

                // Play the sound
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.3);
            } catch (error) {
                // Silent fail if Web Audio API is not supported
                console.log('Audio not supported');
            }
        }

        // ===== STEP NAVIGATION =====
        // Function to show a specific step and hide all others
        function showStep(stepNumber) {
            // Hide all steps
            document.querySelectorAll('.step').forEach(step => {
                step.classList.remove('active');
            });

            // Show the requested step
            const stepToShow = stepNumber === 'final'
                ? document.getElementById('final-screen')
                : document.getElementById(`step-${stepNumber}`);
            stepToShow.classList.add('active');

            state.currentStep = stepNumber;
        }

        // ===== OPTION SELECTION HANDLING =====
        // This function handles when a user clicks on an option in any step
        function handleOptionClick(event) {
            const option = event.currentTarget;
            const step = option.closest('.step');
            const stepId = step.id;

            // Remove 'selected' class from all options in this step
            step.querySelectorAll('.option').forEach(opt => {
                opt.classList.remove('selected');
            });

            // Add 'selected' class to clicked option
            option.classList.add('selected');

            // Store the selection in state based on which step we're on
            const value = option.dataset.value;
            if (stepId === 'step-1') {
                state.selections.color = value;
                // Play engine sound when color is selected
                playEngineSound();
            } else if (stepId === 'step-2') {
                state.selections.tireShape = value;
            } else if (stepId === 'step-3') {
                state.selections.pattern = value;
            }

            // Enable the Next button for this step
            const nextButton = step.querySelector('.btn-next');
            nextButton.disabled = false;
        }

        // ===== NAVIGATION BUTTON HANDLERS =====
        // Handle Next button clicks - advance to next step
        function handleNext(currentStepNum) {
            if (currentStepNum < 3) {
                showStep(currentStepNum + 1);
            } else {
                // Last step - show final screen with the car
                showFinalScreen();
            }
        }

        // Handle Back button clicks - return to previous step
        function handleBack(currentStepNum) {
            if (currentStepNum > 1) {
                showStep(currentStepNum - 1);
            }
        }

        // ===== FINAL SCREEN =====
        // Display the final screen with the customized car
        function showFinalScreen() {
            // Update summary text
            const patternText = state.selections.pattern.charAt(0).toUpperCase() + state.selections.pattern.slice(1);
            const summaryText = `Color: ${state.selections.color} | Tires: ${state.selections.tireShape} | Pattern: ${patternText}`;
            document.getElementById('summary-text').textContent = summaryText;

            // Apply car color and pattern
            const carBody = document.getElementById('car-body');

            // Reset classes first
            carBody.className = 'car-body';

            // Apply pattern class if selected
            if (state.selections.pattern) {
                carBody.classList.add(`pattern-${state.selections.pattern}`);
            }

            // Use backgroundColor instead of background so pattern background-image shows through
            carBody.style.backgroundColor = colorMap[state.selections.color];

            // Apply tire shape
            const wheels = [document.getElementById('wheel-1'), document.getElementById('wheel-2')];
            wheels.forEach(wheel => {
                wheel.className = 'wheel'; // Reset classes
                if (state.selections.tireShape !== 'circle') {
                    wheel.classList.add(state.selections.tireShape);
                }
            });

            // Reset car position and wheel rotation to start
            state.carPosition = 0;
            state.wheelRotation = 0;
            updateCarPosition();

            // Show final screen
            showStep('final');
        }

        // ===== KEYBOARD CONTROLS FOR DRIVING =====
        // Update the car's position and wheel rotation on the road
        function updateCarPosition() {
            const car = document.getElementById('car');
            // Use transform to move the car from its centered position
            car.style.transform = `translateX(calc(-50% + ${state.carPosition}px))`;

            // Update wheel rotation
            const wheels = document.querySelectorAll('.wheel');
            wheels.forEach(wheel => {
                wheel.style.transform = `rotate(${state.wheelRotation}deg)`;
            });
        }

        // Handle keyboard input for driving the car
        function handleKeyPress(event) {
            // Only allow driving when on the final screen
            if (state.currentStep !== 'final') return;

            const road = document.querySelector('.road');
            const car = document.getElementById('car');
            const roadWidth = road.offsetWidth;
            const carWidth = car.offsetWidth;
            // Calculate how far the car can move from center
            const maxOffset = (roadWidth - carWidth) / 2;

            // Left arrow key - move car left
            if (event.key === 'ArrowLeft') {
                state.carPosition = Math.max(-maxOffset, state.carPosition - 20);
                state.wheelRotation -= 30; // Rotate wheels backwards
                updateCarPosition();
            }
            // Right arrow key - move car right
            else if (event.key === 'ArrowRight') {
                state.carPosition = Math.min(maxOffset, state.carPosition + 20);
                state.wheelRotation += 30; // Rotate wheels forwards
                updateCarPosition();
            }
        }

        // ===== RESET FUNCTIONALITY =====
        // Reset all state and return to step 1
        function resetApp() {
            // Clear all selections
            state.selections = {
                color: null,
                tireShape: null,
                pattern: null
            };
            state.carPosition = 0;
            state.wheelRotation = 0;

            // Remove all 'selected' classes from options
            document.querySelectorAll('.option').forEach(opt => {
                opt.classList.remove('selected');
            });

            // Disable all Next buttons
            document.querySelectorAll('.btn-next').forEach(btn => {
                btn.disabled = true;
            });

            // Return to step 1
            showStep(1);
        }

        // ===== EVENT LISTENERS SETUP =====
        // Initialize all event listeners when the page loads
        document.addEventListener('DOMContentLoaded', function() {
            // Add click handlers to all option buttons
            document.querySelectorAll('.option').forEach(option => {
                option.addEventListener('click', handleOptionClick);
            });

            // Add handlers for Next buttons
            document.getElementById('next-1').addEventListener('click', () => handleNext(1));
            document.getElementById('next-2').addEventListener('click', () => handleNext(2));
            document.getElementById('next-3').addEventListener('click', () => handleNext(3));

            // Add handlers for Back buttons
            document.getElementById('back-2').addEventListener('click', () => handleBack(2));
            document.getElementById('back-3').addEventListener('click', () => handleBack(3));

            // Add handler for Start Over button
            document.getElementById('restart').addEventListener('click', resetApp);

            // Add keyboard listener for arrow keys (driving the car)
            document.addEventListener('keydown', handleKeyPress);
        });
    </script>
</body>
</html>
